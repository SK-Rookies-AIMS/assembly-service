name: Build Assembly Service and Update GitOps

on:
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-assembly-service.yml"

  workflow_dispatch:

concurrency:
  group: assembly-service-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: aims-dev-eks
  ECR_REPOSITORY: aims/assembly-service
  NAMESPACE: aims-project

  INFRA_REPOSITORY: SK-Rookies-AIMS/infra
  INFRA_BRANCH: dev

  # 기존 deployment.yaml에서 kustomization.yaml로 변경
  INFRA_MANIFEST_PATH: k8s/assembly-service/kustomization.yaml

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout assembly-service
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 \
          || aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE

      - name: Build and push image
        id: build-image
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_TAG="dev-${GITHUB_SHA::12}"

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${COMMIT_TAG}"
          DEV_IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:dev"

          docker build \
            -t "$IMAGE_URI" \
            -t "$DEV_IMAGE_URI" \
            .

          docker push "$IMAGE_URI"
          docker push "$DEV_IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: ${{ env.INFRA_BRANCH }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          fetch-depth: 0

      # 추가: EKS 접속 설정
      - name: Update kubeconfig and ensure namespace
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # 추가: SSM Parameter Store 값 조회
      - name: Load assembly-service parameters from SSM
        shell: bash
        run: |
          set -euo pipefail

          RDS_SECRET_ARN=$(aws ssm get-parameter \
            --name "/aims/dev/rds/secret-arn" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          RDS_HOST=$(aws ssm get-parameter \
            --name "/aims/dev/backend/rds-host" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          RDS_PORT=$(aws ssm get-parameter \
            --name "/aims/dev/backend/rds-port" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          MAIN_DB_NAME=$(aws ssm get-parameter \
            --name "/aims/dev/backend/main-db-name" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          SAMPLE_DB_NAME=$(aws ssm get-parameter \
            --name "/aims/dev/backend/sample-db-name" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          JWT_SECRET_KEY=$(aws ssm get-parameter \
            --name "/aims/dev/backend/jwt-secret-key" \
            --region "$AWS_REGION" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          for VALUE in \
            "$RDS_SECRET_ARN" \
            "$RDS_HOST" \
            "$RDS_PORT" \
            "$MAIN_DB_NAME" \
            "$SAMPLE_DB_NAME" \
            "$JWT_SECRET_KEY"
          do
            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
              echo "Required assembly-service parameter is empty"
              exit 1
            fi
          done

          echo "::add-mask::$RDS_SECRET_ARN"
          echo "::add-mask::$JWT_SECRET_KEY"

          {
            echo "RDS_SECRET_ARN=$RDS_SECRET_ARN"
            echo "RDS_HOST=$RDS_HOST"
            echo "RDS_PORT=$RDS_PORT"
            echo "MAIN_DB_NAME=$MAIN_DB_NAME"
            echo "SAMPLE_DB_NAME=$SAMPLE_DB_NAME"
            echo "JWT_SECRET_KEY=$JWT_SECRET_KEY"
          } >> "$GITHUB_ENV"

      # 추가: RDS Secrets Manager에서 계정 조회 후 런타임 Secret 생성
      - name: Create or update assembly-service Secret
        shell: bash
        run: |
          set -euo pipefail

          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$RDS_SECRET_ARN" \
            --region "$AWS_REGION" \
            --query "SecretString" \
            --output text)

          DB_USER=$(echo "$SECRET_JSON" | jq -r '.username')
          DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.password')

          if [ -z "$DB_USER" ] || [ "$DB_USER" = "null" ]; then
            echo "DB username is missing"
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ] || [ "$DB_PASSWORD" = "null" ]; then
            echo "DB password is missing"
            exit 1
          fi

          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASSWORD"

          JDBC_OPTIONS="serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"

          MAIN_DB_JDBC_URL="jdbc:mysql://${RDS_HOST}:${RDS_PORT}/${MAIN_DB_NAME}?${JDBC_OPTIONS}"
          SAMPLE_DB_JDBC_URL="jdbc:mysql://${RDS_HOST}:${RDS_PORT}/${SAMPLE_DB_NAME}?${JDBC_OPTIONS}"

          kubectl create secret generic assembly-service-secret \
            --namespace "$NAMESPACE" \
            --from-literal=MAIN_DB_JDBC_URL="$MAIN_DB_JDBC_URL" \
            --from-literal=MAIN_DB_USERNAME="$DB_USER" \
            --from-literal=MAIN_DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=SAMPLE_DB_JDBC_URL="$SAMPLE_DB_JDBC_URL" \
            --from-literal=SAMPLE_DB_USERNAME="$DB_USER" \
            --from-literal=SAMPLE_DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # 변경: image: 전체 URI가 아니라 newTag:만 변경
      - name: Update assembly-service image tag
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="infra/${INFRA_MANIFEST_PATH}"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found: $MANIFEST"
            exit 1
          fi

          IMAGE_TAG="${IMAGE_URI##*:}"

          sed -i -E \
            "s|^([[:space:]]*)newTag:.*$|\1newTag: ${IMAGE_TAG}|" \
            "$MANIFEST"

          grep -n "newTag:" "$MANIFEST"

      - name: Commit and push GitOps change
        shell: bash
        run: |
          set -euo pipefail

          cd infra

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${INFRA_MANIFEST_PATH}"

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "chore(assembly-service): deploy dev-${GITHUB_SHA::12}"

          for ATTEMPT in 1 2 3
          do
            git pull --rebase origin "${INFRA_BRANCH}"

            if git push origin "HEAD:${INFRA_BRANCH}"; then
              exit 0
            fi

            sleep $((ATTEMPT * 5))
          done

          echo "Failed to push infra repository"
          exit 1