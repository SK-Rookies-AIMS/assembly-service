spring:
  application:
    name: assembly-test
  profiles:
    active: test
  cache:
    type: none
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s

management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

logging:
  config: classpath:logback-spring.xml
  level:
    root: info

app:
  datasource:
    main:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:maindb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      maximum-pool-size: 3
      minimum-idle: 1
      pool-name: test-main-db-pool
    sample:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:sampledb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      maximum-pool-size: 3
      minimum-idle: 1
      pool-name: test-sample-db-pool
