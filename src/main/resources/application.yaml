server:
  port: 8082

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${APP_NAME:assembly}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:3s}
  web:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  kafka:
    admin:
      auto-create: false
      fail-fast: false

    bootstrap-servers: ${MSK_BOOTSTRAP_SERVERS}

    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    kafka:
      enabled: false

app:
  datasource:
    main:
      driver-class-name: ${MAIN_DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
      jdbc-url: ${MAIN_DB_JDBC_URL:jdbc:mysql://127.0.0.1:13306/maindb?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8}
      username: ${MAIN_DB_USERNAME:admin}
      password: ${MAIN_DB_PASSWORD:}
      maximum-pool-size: ${MAIN_DB_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${MAIN_DB_MINIMUM_IDLE:2}
      pool-name: ${MAIN_DB_POOL_NAME:main-db-pool}
    sample:
      driver-class-name: ${SAMPLE_DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
      jdbc-url: ${SAMPLE_DB_JDBC_URL:jdbc:mysql://127.0.0.1:13306/sampledb?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8}
      username: ${SAMPLE_DB_USERNAME:admin}
      password: ${SAMPLE_DB_PASSWORD:}
      maximum-pool-size: ${SAMPLE_DB_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SAMPLE_DB_MINIMUM_IDLE:1}
      pool-name: ${SAMPLE_DB_POOL_NAME:sample-db-pool}

  redis:
    cache:
      ttl: ${REDIS_CACHE_TTL:10m}

  opensearch:
    scheme: ${OPENSEARCH_SCHEME:http}
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}

  kafka:
    bootstrap-servers: ${MSK_BOOTSTRAP_SERVERS}
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    listeners-enabled: ${KAFKA_LISTENERS_ENABLED:true}
    scheduler:
      enabled: ${KAFKA_REPLAY_SCHEDULER_ENABLED:false}
      fixed-delay-ms: ${KAFKA_REPLAY_FIXED_DELAY_MS:5000}
      batch-size: ${KAFKA_REPLAY_BATCH_SIZE:10}

    security-protocol: SASL_SSL
    sasl-mechanism: AWS_MSK_IAM
    sasl-jaas-config: software.amazon.msk.auth.iam.IAMLoginModule required;
    sasl-client-callback-handler-class: software.amazon.msk.auth.iam.IAMClientCallbackHandler

    topics:
      raw:
        name: factory.manufacturing.raw
        partitions: 2
      analysis:
        name: factory.manufacturing.analysis
        partitions: 2
      alert:
        name: factory.manufacturing.alert
        partitions: 2
      equipment:
        name: factory.manufacturing.equipment
        partitions: 2

logging:
  config: classpath:logback-spring.xml

jwt:
  secret-key: ${JWT_SECRET_KEY:}
  expiration:
    access: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh: ${JWT_REFRESH_EXPIRATION:1209600000}
